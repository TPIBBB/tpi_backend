[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civsim"
version = "0.1.0"
description = "Multi-Agent 文明模擬器：研究資訊、權限與權力如何影響 AI 社會"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
db = ["psycopg[binary]>=3.1"]
llm = ["google-genai>=3.0", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
civsim = "civsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
