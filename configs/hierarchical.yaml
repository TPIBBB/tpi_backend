# 實驗 C：資訊與授權集中於少數菁英（其他條件與 baseline 相同）
# 只有 15% 的人，看得到價格和預報，而且能把權限授予別人(seed 隨機抽)
# 其他 20 人看不到市價和預報，只能靠菁英授權，或聽別人轉告
# 想觀察的是資訊集中會不會造成財富集中、權力集中
name: hierarchical
seed: 42
ticks: 30
roles: {farmer: 8, woodcutter: 6, craftsman: 4, merchant: 6}
initial_inventory: {food: 8, wood: 0, tools: 1, money: 50}
action_points: 2
agent_controller: rule_based
allow_info_sharing: true
institution:
  preset: hierarchical
  elite_fraction: 0.15
events:
  food_shock_prob: 0.15
  food_shock_multiplier: 0.4
