name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3  # 這個 action 沒有 v10 這種大版本標籤，要寫完整版本
        with:
          enable-cache: true

      # Python 版本依 .python-version；--locked 會在 uv.lock 沒更新時直接失敗
      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest
