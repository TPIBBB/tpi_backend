# 本機開發用基礎服務
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: civsim
      POSTGRES_PASSWORD: civsim
      POSTGRES_DB: civsim
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # digiRunner 開源版（https://github.com/TPIsoftwareOSPO/digiRunner-Open-Source）
  # 管理後台：http://localhost:31080/dgrv4/ac4/login
  # 關閉請用 docker compose stop，不要用 down（down 會刪掉容器，後台的設定可能跟著消失）
  # TODO（第 2 週）：把 world-api 註冊為後端服務
  dgr:
    image: tpisoftwareopensource/digirunner-open-source
    ports:
      # 主機的 31080 對到容器內的 18080
      - "31080:18080"
    environment:
      - TZ=Asia/Taipei

volumes:
  pgdata:
